<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portofolio</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

header {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 10px 0;
}

.container {
  max-width: 1200px;
  margin: 20px auto;
  padding: 0 20px;
}

h1 {
  font-size: 2em;
  margin-bottom: 20px;
}

.card {
  background-color: #f9f9f9;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.card h2 {
  font-size: 1.5em;
  margin-bottom: 10px;
}

.card p {
  font-size: 1em;
  line-height: 1.6;
}
</style>
</head>
<body>

<header>
  <h1>My Portfolio</h1>
</header>

<div class="container">
  <div class="card">
    <h2>Project 1</h2>
    <p>Description of project 1.</p>
  </div>
  
  <div class="card">
    <h2>Project 2</h2>
    <p>Description of project 2.</p>
  </div>
  
  <div class="card">
    <h2>Project 3</h2>
    <p>Description of project 3.</p>
  </div>
</div>

</body>
</html>
