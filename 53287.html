<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML/CSS/JS Editor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        main {
            display: flex;
            flex: 1;
            padding: 20px;
        }

        .editor-container {
            flex: 1;
            margin-right: 10px;
        }

        .editor-header {
            background-color: #34495e;
            color: #fff;
            padding: 10px;
            border-radius: 5px 5px 0 0;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            resize: vertical;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .output-container {
            flex: 1;
            margin-left: 10px;
        }

        #output {
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            box-sizing: border-box;
            padding: 10px;
            overflow: auto;
        }

        .button-container {
            text-align: center;
            padding: 10px;
        }

        button {
            background-color: #3498db;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 12px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }

            .editor-container,
            .output-container {
                margin: 0;
                width: 100%;
            }

            .editor-container {
                margin-bottom: 20px;
            }

            textarea,
            #output {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Modern HTML/CSS/JS Editor</h1>
        <p>Create and test your code in real-time!</p>
    </header>

    <main>
        <div class="editor-container">
            <div class="editor-header">HTML</div>
            <textarea id="html-code" placeholder="Enter your HTML code here"></textarea>
            <div class="editor-header">CSS</div>
            <textarea id="css-code" placeholder="Enter your CSS code here"></textarea>
            <div class="editor-header">JavaScript</div>
            <textarea id="js-code" placeholder="Enter your JavaScript code here"></textarea>
        </div>

        <div class="output-container">
            <h2>Output</h2>
            <iframe id="output"></iframe>
        </div>
    </main>

    <div class="button-container">
        <button onclick="runCode()">Run Code</button>
    </div>

    <footer>
        <p>&copy; 2024 Modern HTML/CSS/JS Editor</p>
    </footer>

    <script>
        function runCode() {
            const htmlCode = document.getElementById("html-code").value;
            const cssCode = document.getElementById("css-code").value;
            const jsCode = document.getElementById("js-code").value;

            const outputFrame = document.getElementById("output").contentWindow.document;
            outputFrame.open();
            outputFrame.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        ${cssCode}
                    </style>
                </head>
                <body>
                    ${htmlCode}
                    <script>
                        ${jsCode}
                    </script>
                </body>
                </html>
            `);
            outputFrame.close();
        }
    </script>
</body>
</html>
