<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Screenshot</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #screenshot {
            margin-top: 20px;
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Auto Screenshot and Send to Telegram</h1>
        <p>Click the button below to take a screenshot of this page and automatically send it to your Telegram account.</p>
        <button id="captureBtn">Capture & Send</button>
        <img id="screenshot" src="" alt="Screenshot">
    </div>

    <script>
        document.getElementById('captureBtn').addEventListener('click', function() {
            html2canvas(document.body).then(function(canvas) {
                document.getElementById('screenshot').src = canvas.toDataURL();
                sendToTelegram(canvas.toDataURL());
            });
        });

        function sendToTelegram(imageData) {
            const botToken = '8011320429:AAGozvscDyRHBQQRK_vOKlEYY3K8u_CDCwI';
            const chatId = '7739144010';
            const apiUrl = `https://api.telegram.org/bot${botToken}/sendPhoto`;

            fetch(apiUrl, {
                method: 'POST',
                body: JSON.stringify({
                    chat_id: chatId,
                    photo: imageData,
                    caption: 'Screenshot from website'
                }),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert('Screenshot sent to Telegram!');
                } else {
                    alert('Failed to send screenshot: ' + JSON.stringify(data));
                }
            })
            .catch(error => {
                console.error('Error sending screenshot:', error);
                alert('Error sending screenshot. Check console.');
            });
        }
    </script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>
