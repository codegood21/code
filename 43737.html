<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Shouldn't Be Here...</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #111;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: glow 2s infinite alternate;
        }

        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        button {
            background-color: #e44d26;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #c63d17;
        }

        #jumpscareImage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1000;
        }

        #jumpscareSound {
            display: none;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073, 0 0 40px #e60073, 0 0 50px #e60073, 0 0 60px #e60073, 0 0 70px #e60073;
            }
            to {
                text-shadow: 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6, 0 0 50px #ff4da6, 0 0 60px #ff4da6, 0 0 70px #ff4da6, 0 0 80px #ff4da6;
            }
        }

        /* Loading Animation */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader {
            border: 16px solid #f3f3f3; /* Light grey */
            border-top: 16px solid #3498db; /* Blue */
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="loader-container" id="loaderContainer">
        <div class="loader"></div>
    </div>

    <div class="container">
        <h1>Are You Sure?</h1>
        <p>This website may contain content not suitable for all audiences.</p>
        <button id="proceedButton">Proceed with Caution</button>
    </div>

    <img id="jumpscareImage" src="https://i.imgur.com/73xP98n.jpeg" alt="Jumpscare">
    <audio id="jumpscareSound" src="https://www.myinstants.com/media/sounds/scary-sound-effect-2_1.mp3"></audio>

    <script>
        const proceedButton = document.getElementById('proceedButton');
        const jumpscareImage = document.getElementById('jumpscareImage');
        const jumpscareSound = document.getElementById('jumpscareSound');
        const loaderContainer = document.getElementById('loaderContainer');


        window.addEventListener('load', () => {
            loaderContainer.style.display = 'none'; // Hide the loader after content is loaded
        });


        proceedButton.addEventListener('click', () => {
            jumpscareImage.style.display = 'block';
            jumpscareSound.play();
            document.body.style.backgroundColor = 'red'; // Flashy background

            setTimeout(() => {
                jumpscareImage.style.display = 'none';
                document.body.style.backgroundColor = '#111'; // Reset background
            }, 3000); // Adjust timing as needed
        });
    </script>

</body>
</html>
