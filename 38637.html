<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Screenshot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 80%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Future!</h1>
        <p>This is a dynamically generated page designed to be automatically screenshotted and sent to Telegram.</p>
        <button onclick="captureAndSend()">Take Screenshot & Send to Telegram</button>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        function captureAndSend() {
            html2canvas(document.body).then(canvas => {
                canvas.toBlob(function(blob) {
                    const formData = new FormData();
                    formData.append('photo', blob, 'screenshot.png');
                    formData.append('chat_id', '7739144010');
                    formData.append('caption', 'Screenshot from auto-capture page');

                    fetch(`https://api.telegram.org/bot8011320429:AAGozvscDyRHBQQRK_vOKlEYY3K8u_CDCwI/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.ok) {
                            alert('Screenshot sent successfully!');
                        } else {
                            alert('Error sending screenshot: ' + JSON.stringify(data));
                            console.error('Telegram API Error:', data);
                        }
                    })
                    .catch(error => {
                        console.error('Fetch Error:', error);
                        alert('Error taking or sending screenshot: ' + error);
                    });
                });
            });
        }
    </script>
</body>
</html>
