<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tele Spam Bot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            width: 80%;
            max-width: 600px;
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #00bcd4;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(0, 188, 212, 0.8);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 16px;
            color: #ccc;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
            font-size: 16px;
            transition: background-color 0.3s ease-in-out;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            background-color: #444;
            outline: none;
        }

        button {
            background-color: #00bcd4;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
        }

        button:hover {
            background-color: #0097a7;
            transform: scale(1.05);
        }

        .contact-dev {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }

        .contact-dev a {
            color: #00bcd4;
            text-decoration: none;
            transition: color 0.3s ease-in-out;
        }

        .contact-dev a:hover {
            color: #0097a7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tele Spam Bot</h1>
        <div class="form-group">
            <label for="token">Token Bot:</label>
            <input type="text" id="token" name="token" placeholder="Masukkan Token Bot Telegram">
        </div>
        <div class="form-group">
            <label for="targetId">ID Telegram Target:</label>
            <input type="text" id="targetId" name="targetId" placeholder="Masukkan ID Telegram Target">
        </div>
        <div class="form-group">
            <label for="delay">Delay (detik):</label>
            <input type="number" id="delay" name="delay" value="5" placeholder="Masukkan Delay Antar Pesan (detik)">
        </div>
        <div class="form-group">
            <label for="message">Pesan:</label>
            <textarea id="message" name="message" rows="4" placeholder="Masukkan Pesan Spam"></textarea>
        </div>
        <button onclick="alert('Fitur ini belum diimplementasikan.')">Mulai Spam</button>
        <div class="contact-dev">
            Hubungi Pengembang: <a href="https://wa.me/6288293006543" target="_blank">6288293006543</a>
        </div>
    </div>
</body>
</html>
