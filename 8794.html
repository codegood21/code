<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Editor</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
        }

        .editor-panel {
            flex: 1;
            min-width: 400px;
            margin-right: 20px;
        }

        .preview-panel {
            flex: 1;
            min-width: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 4px;
            background-color: #f9f9f9;
            overflow: auto;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: monospace;
            font-size: 14px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #3e8e41;
        }

        .code-container {
            background-color: #282c34;
            color: #abb2bf;
            padding: 10px;
            border-radius: 4px;
            overflow: auto;
            font-family: monospace;
        }

        .code-container pre {
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .editor-panel, .preview-panel {
                width: 100%;
                margin-right: 0;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>HTML Editor</h1>

    <div class="container">
        <div class="editor-panel">
            <h2>Editor</h2>
            <textarea id="htmlCode" placeholder="Enter HTML code here"></textarea>
            <button onclick="updatePreview()">Update Preview</button>
            <h2>Code</h2>
            <div class="code-container">
                <pre><code id="formattedCode"></code></pre>
            </div>
        </div>

        <div class="preview-panel">
            <h2>Preview</h2>
            <iframe id="preview" style="width: 100%; height: 400px; border: none;"></iframe>
        </div>
    </div>

    <script>
        function updatePreview() {
            const htmlCode = document.getElementById("htmlCode").value;
            const previewFrame = document.getElementById("preview");
            const formattedCodeElement = document.getElementById("formattedCode");

            previewFrame.src = "data:text/html;charset=utf-8," + encodeURIComponent(htmlCode);
            formattedCodeElement.textContent = htmlCode;
        }
    </script>

</body>
</html>
